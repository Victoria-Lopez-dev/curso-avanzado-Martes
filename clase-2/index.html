<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">    
<link rel="stylesheet" href="./style.css">
<title>Clase -2</title>
</head>
<body onload="mostrarDuracion()">
    <h1>Audio y Video </h1>

     <audio src="./assets/aves.mp3" ></audio>

    <button id="btn-audio">AUDIO <span class="estado">ON</span></button>
   
    <h2>Video con atributo controls</h2>
    <video src="./assets/videos/video2.mp4" controls autoplay loop>
    </video>

    <h2>Video con barra personalizada</h2>

    <article>
        <video poster="./assets/bosque.jpg" id="video2" >
            <source src="./assets/videos/video2.mp4" type="video/mp4"/>
            <source src="./assets/videos/video2.ogv" type="video/ogv"/>
        </video>
        <div class="barra-reproduccion">
            <div class="botonera">
                <button class="btn-barra" id="video-play">PLAY</button>
                <button class="btn-barra" id="video-pause">PAUSE</button>                
                <button>SONIDO OFF</button>
            </div>
            <div class="duracion">
                <p><span id="duracion-actual">00:00</span>/<span id="duracion-total">00</span></p>
            </div>
            <div class="barra-progreso">
                <div class="progreso" ></div>
            </div>
        </div>

    </article>


    <script src="./video-audio.js"></script>
</body>
</html>
<!--
audio y video 
atributos:
    controls -> barra de reproduccion predeterminada por cada browser/navegador
    poster -> imagen de fondo antes de su reproduccion
    loop -> bucle infinito de reproduccion
    autoplay -> reproduccion automatica (no agregar poster)
  
    timeupdate -> evento que se ejecuta cuando cambia el tiempo. 
-->
